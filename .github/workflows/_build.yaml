name: "run build"

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    # env:
    # AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    # NEXT_PUBLIC_API_ROOT: ${{ secrets.NEXT_PUBLIC_API_ROOT }}
    # KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
    # KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    # NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
    # REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    # DEMO_LOGIN_SECRET: ${{ secrets.DEMO_LOGIN_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Environment for build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm

      # @kojaem/mongmong(디자인시스템)은 GitHub Packages에 있어 토큰이 필요하다.
      # 로컬 .npmrc는 .gitignore라서 CI에서는 시크릿으로 만든다.
      - name: Configure GitHub Packages auth
        run: |
          echo "@kojaem:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build
